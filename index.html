<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Cadastro</title>
    <style>
        body{
            background-color: rgb(79, 228, 99);
        }
        h1{
            color: rgb(122, 22, 216);
            text-align: center;
            font-family: cursive;
        }
    </style>
</head>
<body>
    <header>

    </header>
    <main>
        <h1>Cadastro de Clientes</h1>
        <form>
            <label for="nome"> Nome:</label>
            <input type="text" id="nome" placeholder="Guilherme, Richard, Pietro, Nycolas" required class="input_text">

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="444.444.444-44" required class="input_text">

            <label for="datadenascimento">Data de nascimento</label>
            <input type="text" id="datadenascimento" placeholder="22/22/2222" required class="input_text">

            <label for="e-mail">E-mail</label>
            <input type="text" id="e-mail" placeholder="@gmail.com" required class="input_text">

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(99) 9999-9999" required class="input_text">

            <label for="cep">CEP</label>
            <input type="text" id="cep" placeholder="00000-000" required class="input_text">

            <label for="número">Número</label>
            <input type="text" id="número" placeholder="190, 270, 183" required class="input_text">

            <label for="rua">Rua</label>
            <input type="text" id="rua" placeholder="pin da manhangaba" required class="input_text">

            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" placeholder="Água Verde, Santa Felicidade, Cabral e Bigorrilho" required class="input_text">

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="Paraná" required class="input_text">

            <label for="estado">Estado</label>
            <input type="text" id="estado" placeholder="Londrina, Maringá, Ponta Grossa, Cascavel" required class="input_text">

            <label for="senha">Senha</label>
            <input type="text" id="senha" placeholder="AS3nH@!$2023" required class="input_text">

            
                <!-- CEP, Rua, Número, Bairro, Cidade, Estado(UF), Senha-->

            <input type="submit" value="Enviar Cadastro" class="btn_enviar">
        </form>
    </main>
    <footer>

    </footer>
</body>
</html>
